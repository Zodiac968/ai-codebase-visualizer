services:
  # 1. PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: visualizer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codebase_visualizer
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codebase_visualizer"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Neo4j Community Edition 5+
  neo4j:
    image: neo4j:5-community
    container_name: visualizer_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visualizer_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "AI Codebase Visualizer API"
      APP_ENV: "development"
      DEBUG: "True"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/codebase_visualizer"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "password123"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
      PORT: 8000
      HOST: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/data/repos:/app/data/repos

volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
